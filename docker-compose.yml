services:
  db:
    image: postgres:16-alpine
    container_name: brightloop_db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: brightloop
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d brightloop"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: brightloop_api
    command: >
      sh -c "alembic upgrade head &&
             python seed.py &&
             uvicorn app.main:app --host 0.0.0.0 --port 8000"
    environment:
      - DATABASE_URL=postgresql+psycopg://postgres:postgrespassword@db:5432/brightloop
      - SECRET_KEY=brightloop-super-secret-jwt-key-production-ready
      - ENVIRONMENT=production
      - FRONTEND_URL=http://localhost
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: brightloop_worker
    command: python -m app.jobs.worker
    environment:
      - DATABASE_URL=postgresql+psycopg://postgres:postgrespassword@db:5432/brightloop
      - ENVIRONMENT=production
    depends_on:
      db:
        condition: service_healthy

  web:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: brightloop_web
    ports:
      - "80:80"
    depends_on:
      - api

volumes:
  postgres_data:

